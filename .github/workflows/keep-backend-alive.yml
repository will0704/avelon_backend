name: Keep Backend Alive

on:
  workflow_dispatch:  # Manual diagnostics only; no recurring traffic

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Avelon backend
        run: |
          curl -f https://avelon-backend.onrender.com/ \
            -H "User-Agent: GitHub-Actions-KeepAlive" \
            -w "\nStatus: %{http_code}\n" \
            || echo "⚠️ Ping failed, but workflow continues..."

      - name: Log success
        if: success()
        run: echo "✅ Backend ping successful at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
