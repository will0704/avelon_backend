services:
  - type: web
    name: avelon-backend
    runtime: node
    region: singapore
    plan: free
    rootDir: .
    buildCommand: npm install --include=dev && npx prisma generate && npm run build && npx prisma migrate deploy
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # Render's load balancer is the one proxy in front of us, so exactly one
      # trailing X-Forwarded-For entry is trustworthy. Rate limiting keys on it.
      - key: TRUSTED_PROXY_COUNT
        value: 1
      # Neon connection string, set in the dashboard. Render's own free Postgres is
      # deleted 30 days after creation — that is what killed the last deployment.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      # PRISMA_FIELD_ENCRYPTION_KEY — set manually in dashboard
      # Generate with: npx @47ng/cloak generate
      # Set these manually in the Render dashboard:
      # GMAIL_USER
      # GMAIL_APP_PASSWORD
      # CHAIN_ID              — 84532 for Base Sepolia
      # CHAIN_RPC_URL         — SEPOLIA_RPC_URL still works as a fallback
      # CHAIN_PRIVATE_KEY     — SEPOLIA_PRIVATE_KEY still works as a fallback
      # TREASURY_ADDRESS
      # AVELON_LENDING_ADDRESS
      # COLLATERAL_MANAGER_ADDRESS
      # REPAYMENT_SCHEDULE_ADDRESS
      # FIREBASE_PROJECT_ID
      # FIREBASE_PRIVATE_KEY
      # FIREBASE_CLIENT_EMAIL
      # ENCRYPTION_KEY
      # AI_SERVICE_URL      — the Cloud Run URL
      # AI_API_KEY
